[package]
name = "ri"
version = "0.1.0"
edition = "2021"
description = "Rust package manager CLI inspired by @antfu/ni"


[[bin]]
name = "ri"
path = "src/main.rs"

[[bin]]
name = "rr"
path = "src/bin/rr.rs"

[[bin]]
name = "rx"
path = "src/bin/rx.rs"

[[bin]]
name = "ru"
path = "src/bin/ru.rs"

[[bin]]
name = "rd"
path = "src/bin/rd.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
which = "6.0"
